  osf_existing_data_level: "following_analysis (Tier 1 on Devign/ReVeal test); prior_to_analysis (Tiers 2-3 and unexecuted Table B/D contrasts)"
  plan_frozen_evidence: "Commit 49cd2a2 (2026-11-01) and unified syllabus 00_Reports_and_Docs/PhuongAn2_De_cuong_nghien_cuu_GRACE_hop_nhat.pdf"

stop_rules:
  - "If SUP-LR advantage disappears after sanitization/label audit: resolve data issues first, do not draft."
  - "If prompt audit shows graph/demo missing from model (empty demo, graph missing > 5%): fix contract, rerun affected arms."
  - "If smoke test fails: do not pre-register until backend is quantitatively stable."
  - "Do not open additional models/thresholds/arms after observing test; all additions marked 'exploratory' and reserved for journal version."
