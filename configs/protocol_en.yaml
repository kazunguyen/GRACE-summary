  osf_existing_data_level: "following_analysis: B0/B1/B2 test metrics viewed; 230 B2-flip Devign test raw labels viewed; B2-rand validation partly run; prior_to_analysis only for each analysis still unperformed at OSF submission"
  plan_frozen_evidence: "Commit 49cd2a2 (2026-11-01) is a historical local plan recorded after inference began, not proof of OSF preregistration; see exposure_ledger"

stop_rules:
  - "If SUP-LR advantage disappears after sanitization/label audit: resolve data issues first, do not draft."
  - "If prompt audit shows graph/demo missing from model (empty demo, graph missing > 5%): fix contract, rerun affected arms."
  - "If smoke test fails: do not pre-register until backend is quantitatively stable."
  - "From the present registration onward, model/threshold/arm changes require a dated exploratory amendment; this rule does not retroactively characterize exposed runs."
