             identity_matches_frozen_protocol: "yes|no", action: "keep|rerun|rerun_repeat_only"}
  entries:
    - {arm: B0, dataset: devign, split: validation, first_run_utc: "2026-11-01T04:21:38Z", commit: "7b045e7", metrics_viewed: mcc_auroc, identity_matches_frozen_protocol: "yes", action: keep}
    - {arm: B0, dataset: devign, split: test, first_run_utc: "2026-11-01T04:21:38Z", commit: "7b045e7", metrics_viewed: mcc_auroc, identity_matches_frozen_protocol: "yes", action: keep}
