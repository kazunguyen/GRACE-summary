[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "grace-diag"
version = "0.1.0"
description = "Bộ công cụ chẩn đoán GRACE: probe thay-một-thành-phần, chấm điểm logprob, mốc có giám sát, thống kê ghép cặp"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23", "scipy>=1.10", "scikit-learn>=1.2", "pyyaml>=6", "openai>=1.0"]

[project.optional-dependencies]
tokenizer = ["transformers>=4.51"]
figures = ["matplotlib>=3.7"]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]
