stop_rules:
  - "Nếu lợi thế của SUP-LR biến mất sau khử trùng/kiểm toán nhãn: sửa dữ liệu trước, không viết."
  - "Nếu audit cho thấy graph/demo không thực sự tới model (demo rỗng, graph thiếu > 5%): sửa contract, chạy lại arm liên quan."
  - "Nếu smoke test không đạt: không đăng ký trước cho đến khi backend ổn định."
  - "Từ bản đăng ký hiện tại, mọi đổi model/ngưỡng/arm phải có amendment ghi ngày và phân loại thăm dò; không áp dụng quy tắc này hồi tố cho run đã tiếp xúc."
